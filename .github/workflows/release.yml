name: Release

# 실행 시점
#   - v* 태그 push  : macOS(arm64/x64) + Windows 빌드 후 GitHub Release 에 첨부
#   - 수동 실행      : 빌드만 하고 Actions 아티팩트로 남김 (릴리스 없음)
#
# 자동 업데이트: 설치된 앱(electron-updater)이 Releases 의 latest.yml(Windows) / latest-mac.yml(Mac) 을 읽어
# 새 버전을 알아낸다. 두 yml 과 *.blockmap(차등 다운로드) 을 반드시 설치 파일과 같은 릴리스에 올려야 하고,
# 릴리스는 draft/prerelease 가 아니어야 한다. package.json 의 build.publish 가 이 파일들을 만든다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # 릴리스 생성 및 파일 업로드

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 태그 버전과 package.json 버전이 다르면 파일 이름이 어긋나므로 먼저 막는다.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그 = package.json 버전 확인
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::태그(v$TAG)와 package.json 버전($PKG)이 다릅니다. package.json 버전을 올리고 다시 태그하세요."
            exit 1
          fi

  build-mac:
    needs: [check-version]
    # 수동 실행일 때는 check-version 이 스킵되므로 그 경우도 통과시킨다.
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: macos-latest # Apple Silicon 러너. x64 는 크로스 빌드
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: macOS 빌드 (dmg + zip, arm64 + x64)
        # electron-builder 는 CI 에서 태그를 보면 스스로 릴리스에 올리려 한다(GH_TOKEN 요구). 업로드는 release 잡이 하므로 끈다.
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 미서명 빌드
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-win:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Windows 빌드 (설치본 + 포터블)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: 업데이트 메타데이터 확인
        # 이 파일이 없으면 설치된 앱이 새 버전을 알 수 없다. 빌드 설정(build.publish)이 깨졌을 때 조용히 넘어가지 않게 막는다.
        run: |
          test -f artifacts/latest.yml || { echo "::error::latest.yml 이 없습니다 (Windows 자동 업데이트 불가)"; exit 1; }
          test -f artifacts/latest-mac.yml || { echo "::error::latest-mac.yml 이 없습니다 (Mac 업데이트 알림 불가)"; exit 1; }
          echo "--- latest.yml"; cat artifacts/latest.yml
          echo "--- latest-mac.yml"; cat artifacts/latest-mac.yml
      - name: GitHub Release 생성 및 파일 첨부
        uses: softprops/action-gh-release@v2
        with:
          name: 주간 업무 일지 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/*.yml
          body: |
            ## 설치

            | 환경 | 파일 |
            | --- | --- |
            | Mac (Apple Silicon, M1 이후) | `routine-weekly-*-mac-arm64.dmg` |
            | Mac (Intel) | `routine-weekly-*-mac-x64.dmg` |
            | Windows 설치본 | `routine-weekly-setup-*.exe` |
            | Windows 무설치 | `routine-weekly-portable-*.exe` |

            **Mac**: 코드 서명이 없어 처음 열 때 "확인되지 않은 개발자" 또는 "손상되었음" 경고가 뜹니다.
            dmg 에서 앱을 응용 프로그램 폴더로 끌어 넣은 뒤, 아래 중 하나로 넘기세요.

            - Finder 에서 앱을 **우클릭 > 열기**, 대화상자에서 다시 **열기**
            - 또는 터미널에서 `xattr -cr /Applications/RoutineWeekly.app`

            **Windows**: SmartScreen 경고가 뜨면 **추가 정보 > 실행**.

            설정과 로그인 정보는 이전 버전 것이 그대로 유지됩니다.

            ## 자동 업데이트

            - **Windows 설치본**: 이미 설치돼 있으면 새 버전을 백그라운드로 내려받고, 준비되면 앱 창 우측 하단에 안내가 뜹니다.
              "지금 재시작" 을 누르거나 다음에 앱을 종료할 때 자동으로 설치됩니다.
            - **Mac / Windows 무설치**: 새 버전이 나오면 앱 안에 안내만 뜨고, 이 페이지에서 직접 내려받아 바꿔 주세요.
            - `latest.yml`, `latest-mac.yml`, `*.blockmap` 은 자동 업데이트용 파일입니다. 직접 받을 필요 없습니다.
